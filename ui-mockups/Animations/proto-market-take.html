<!DOCTYPE html>
<!--
  NIGHT MARKET — TAKE A CARD (market → operator's hand)  ·  motion prototype
  ============================================================================
  Click a market card (or TAKE the highlighted one). The card LIFTS
  (anticipation), then ARCS down-and-across to the fanned hand — growing a soft
  shadow at pickup, tightening it on landing — and TUCKS into the fan with a
  gentle settle. The neighboring hand cards EASE APART to make room. The emptied
  market slot briefly DIMS, then a REPLACEMENT arcs in from the deck and its
  neon accent fades up. Self-contained; uses the existing GameCard look.

  MOTION LANGUAGE  ·  "Everdell-style" (Dire Wolf) — feel only, not the art
    Gentle, tactile, unhurried, weighty, sequenced. ease =
    cubic-bezier(.34,.08,.16,1). Landings damp a ~5% overshoot in ONE step.
    travel 340–520ms · micro 150–200ms · stagger 70–90ms · ARCING path
    (rise + shadow bloom at pickup, lower + tighten on landing). Neon brightens
    gently, never strobes; rare tier keeps its glow.

  KEYFRAME / ANIMATION SPEC  (lift straight into the game)
  ---------------------------------------------------------------------------
  name        driver  property changes                          dur    easing
  pickLift    WAAPI   source card translateY -12 + scale 1.03   160ms  cubic-bezier
                      (anticipation before travel)                     (.34,.08,.16,1)
  toHand      WAAPI   flyer clone translate(market→hand) along  460ms  cubic-bezier
                      arc, rotate 0→fan-angle, ~5% overshoot           (.34,.08,.16,1)
                      then squash→1
  toHandShadow WAAPI  drop-shadow blooms at apex, tightens on   ==toHand  ↑
                      landing (weight cue)
  fanApart    CSS tr  neighbor hand cards ease to new fan       420ms  cubic-bezier
                      transforms (make room)                           (.34,.08,.16,1)
  tuckSettle  WAAPI   landed hand card scale 1.04→1 (settle)    180ms  ease-hud
  slotDim     CSS tr  emptied market slot fades to dashed ghost 220ms  ease-out
  restock     WAAPI   replacement arcs deck→slot (same arc)     420ms  cubic-bezier
  neonLit     CSS tr  replacement accent dim→full fades up      360ms  ease-out
  rareBreathe CSS kf  rare glow gently pulses (kept, restrained)3.6s   ease-in-out loop
  dust        CSS kf  6 light motes drift up+out, fade+shrink   620ms  ease-out
  hoverLift   CSS tr  card lifts -8px + faint accent glow       160ms  ease-hud
  ---------------------------------------------------------------------------
  prefers-reduced-motion: NO travel — the card appears in the hand, neighbors
  reposition instantly, the slot restocks with a cross-fade. No arc, no dust.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIGHT MARKET — Take a Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-page:#0a0e16; --bg-panel:#141a24; --bg-inset:#070a10;
  --text-primary:#e6eef7; --text-muted:#566a84; --text-secondary:#92a5bc;
  --border-panel:#26334a; --border-subtle:#1a2333; --border-dim:#232f44;
  --accent-ui:#4fc3d9;
  --rare-cyan:#00e5ff; --rare-gold:#ffc94d; --rare-magenta:#ff2d96;
  --common-green:#6fa07d; --common-orange:#b97a4b; --common-purple:#8578ad;
  --glow-cyan:0 0 6px rgba(0,229,255,.55),0 0 20px rgba(0,229,255,.28),0 0 48px rgba(0,229,255,.12);
  --glow-gold:0 0 6px rgba(255,201,77,.55),0 0 20px rgba(255,201,77,.28),0 0 48px rgba(255,201,77,.12);
  --glow-magenta:0 0 6px rgba(255,45,150,.55),0 0 20px rgba(255,45,150,.28),0 0 48px rgba(255,45,150,.12);
  --font-display:'Chakra Petch','Trebuchet MS',sans-serif;
  --font-mono:'IBM Plex Mono','Consolas',monospace;
  --cut:12px;
  --clip-card:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);
  --EE:cubic-bezier(.34,.08,.16,1);
  --ease-hud:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#0d1420 0%,var(--bg-page) 64%);
  color:var(--text-primary);font-family:var(--font-display);
  display:flex;flex-direction:column;align-items:center;gap:20px;min-height:100%;padding:34px 24px 44px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}

.head{display:flex;align-items:center;gap:14px;width:100%;max-width:1060px}
.head .ttl{font:600 16px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--text-primary);text-shadow:0 0 12px rgba(79,195,217,.25)}
.head .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(79,195,217,.5),transparent)}
.head .cap{font:500 10px/1 var(--font-mono);letter-spacing:.22em;color:var(--text-muted)}

/* ---- panels ---- */
.panel{position:relative;width:100%;max-width:1060px;padding:24px 30px;
  background:linear-gradient(180deg,rgba(20,26,36,.5),rgba(10,14,22,.34));
  border:1px solid var(--border-panel);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.panel.market{border-top:1px solid rgba(79,195,217,.4);box-shadow:0 0 50px rgba(79,195,217,.09),inset 0 22px 44px rgba(79,195,217,.05)}
.plab{position:absolute;top:-9px;left:24px;font:600 9px/1 var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);background:var(--bg-page);padding:0 8px}

.mrow{display:flex;align-items:center;gap:22px}
.mdeckcol{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0}
.mdeck{position:relative;width:84px;height:118px}
.mdeck .layer,.mdeck .face{position:absolute;inset:0;clip-path:var(--clip-card)}
.mdeck .layer{background:linear-gradient(160deg,#16202c,#0b111a);border:1px solid var(--border-panel)}
.mdeck .layer.l1{transform:translate(6px,6px);opacity:.45}
.mdeck .layer.l2{transform:translate(3px,3px);opacity:.7}
.mdeck .face{background:radial-gradient(circle at 50% 40%,#12202a,#070c13);border:1px solid rgba(79,195,217,.4);display:grid;place-items:center;box-shadow:inset 0 0 18px rgba(79,195,217,.08)}
.mdeck .face svg{width:28px;height:28px;color:rgba(79,195,217,.5)}
.mdeck .cnt{position:absolute;bottom:7px;left:0;right:0;text-align:center;font:600 12px/1 var(--font-mono);color:var(--accent-ui)}
.mdeckcol .k{font:600 8px/1 var(--font-display);letter-spacing:.18em;color:var(--text-muted)}

.mkt{display:flex;gap:13px;flex:1;justify-content:center}
.slot{position:relative;width:112px;height:157px;flex-shrink:0;border:1px solid transparent;transition:opacity .22s ease-out}
.slot.empty{opacity:1}
.slot.empty::after{content:"";position:absolute;inset:0;border:1px dashed var(--border-panel);clip-path:var(--clip-card);background:rgba(255,255,255,.012)}
.slot.empty>.card{display:none}

/* ============================ GAME CARD ============================ */
.card{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  background:var(--bg-panel);border:1px solid var(--border-dim);clip-path:var(--clip-card);cursor:pointer;
  transition:border-color .36s ease-out,transform .16s var(--ease-hud),box-shadow .3s ease-out}
.card .cc{position:absolute;top:0;right:0;width:var(--cut);height:var(--cut);background:rgba(255,255,255,.02);border-left:1px solid var(--border-dim);transition:background .36s ease-out,border-color .36s ease-out}
.card .ch{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;gap:4px}
.card .cn{font:600 9px/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);transition:color .36s ease-out,text-shadow .36s ease-out}
.card .pip{display:flex;gap:2px;margin-right:4px;flex-shrink:0}
.card .pip i{width:4px;height:4px;background:var(--text-muted);transform:rotate(45deg);transition:background .36s ease-out}
.card .well{flex:1;margin:0 1px;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),repeating-linear-gradient(135deg,var(--bg-inset) 0 8px,#0b1018 8px 16px);
  display:grid;place-items:center;overflow:hidden}
.card .well svg{width:42%;height:42%;opacity:.55;transition:opacity .36s ease-out,filter .36s ease-out}
.card .ft{display:flex;align-items:flex-end;justify-content:space-between;padding:7px 9px 8px;gap:4px}
.card .ty{font:600 6px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.card .vl{font:600 15px/1 var(--font-mono);color:var(--text-muted);transition:color .36s ease-out,text-shadow .36s ease-out}
.card .strip{position:absolute;left:0;bottom:0;width:16px;height:2px;background:transparent;transition:background .36s ease-out}

.card.lit{border-color:var(--cl)}
.card.lit .cc{background:var(--gl);border-left-color:var(--cl)}
.card.lit .cn{color:var(--nm)}
.card.lit .pip i{background:var(--c)}
.card.lit .well svg{opacity:.95}
.card.lit .vl{color:var(--c)}
.card.lit .strip{background:var(--c)}
.card.lit.rare{box-shadow:var(--gw);animation:rareBreathe 3.6s var(--ease-hud) infinite;animation-delay:.4s}
.card.lit.rare .cn{text-shadow:0 0 7px var(--c)}
.card.lit.rare .vl{text-shadow:0 0 10px var(--c)}
.card.lit.rare .well svg{filter:drop-shadow(0 0 5px var(--c))}

/* highlighted "takeable" market card breathes softly */
.card.target::after{content:"";position:absolute;inset:-1px;clip-path:var(--clip-card);pointer-events:none;
  border:1px solid var(--accent-ui);opacity:.0;animation:targetBreathe 1.8s ease-in-out infinite}
@keyframes targetBreathe{0%,100%{opacity:.25;box-shadow:0 0 8px rgba(79,195,217,.25)}50%{opacity:.7;box-shadow:0 0 18px rgba(79,195,217,.5)}}

.slot .card:hover,.hand .card:hover{transform:translateY(-8px);box-shadow:0 14px 26px rgba(0,0,0,.5),0 0 16px var(--gl)}
.slot .card.rare:hover,.hand .card.rare:hover{box-shadow:0 14px 26px rgba(0,0,0,.5),var(--gw)}
.card:active{transform:translateY(-4px)}

@keyframes rareBreathe{0%,100%{box-shadow:0 0 5px var(--gc1),0 0 16px var(--gc2),0 0 40px var(--gc3)}50%{box-shadow:0 0 8px var(--gc1),0 0 26px var(--gc2),0 0 58px var(--gc3)}}

.a-cyan{--c:var(--rare-cyan);--cl:var(--rare-cyan);--nm:var(--rare-cyan);--gw:var(--glow-cyan);--gl:rgba(0,229,255,.12);--gc1:rgba(0,229,255,.5);--gc2:rgba(0,229,255,.24);--gc3:rgba(0,229,255,.1)}
.a-gold{--c:var(--rare-gold);--cl:var(--rare-gold);--nm:var(--rare-gold);--gw:var(--glow-gold);--gl:rgba(255,201,77,.12);--gc1:rgba(255,201,77,.5);--gc2:rgba(255,201,77,.24);--gc3:rgba(255,201,77,.1)}
.a-mag{--c:var(--rare-magenta);--cl:var(--rare-magenta);--nm:var(--rare-magenta);--gw:var(--glow-magenta);--gl:rgba(255,45,150,.12);--gc1:rgba(255,45,150,.5);--gc2:rgba(255,45,150,.24);--gc3:rgba(255,45,150,.1)}
.a-grn{--c:var(--common-green);--cl:color-mix(in srgb,var(--common-green) 60%,transparent);--nm:var(--text-primary);--gw:none;--gl:rgba(111,160,125,.10)}
.a-org{--c:var(--common-orange);--cl:color-mix(in srgb,var(--common-orange) 60%,transparent);--nm:var(--text-primary);--gw:none;--gl:rgba(185,122,75,.10)}
.a-pur{--c:var(--common-purple);--cl:color-mix(in srgb,var(--common-purple) 60%,transparent);--nm:var(--text-primary);--gw:none;--gl:rgba(133,120,173,.10)}

/* ---- hand fan ---- */
.handwrap{position:relative;width:100%;max-width:1060px;display:flex;flex-direction:column;align-items:center;gap:8px}
.handlab{font:600 9px/1 var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted)}
.hand{position:relative;width:640px;height:210px}
.hand .card{position:absolute;left:50%;bottom:6px;width:104px;height:146px;margin-left:-52px;
  transform-origin:50% 122%;transition:transform .42s var(--EE),box-shadow .3s ease-out,border-color .36s ease-out}
.hand .card:hover{transform:var(--t) translateY(-14px)!important;z-index:20}

/* ---- flight layer ---- */
.flylayer{position:fixed;inset:0;pointer-events:none;z-index:60}
.flyer{position:fixed;transform-origin:50% 50%;will-change:transform,filter}
.flyer .card{width:100%;height:100%;transition:none;cursor:default}

/* ---- dust ---- */
.mote{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none;z-index:70;background:var(--mc);box-shadow:0 0 6px var(--mc);animation:dust .62s ease-out forwards}
@keyframes dust{0%{opacity:0;transform:translate(0,0) scale(.4)}22%{opacity:.9}100%{opacity:0;transform:translate(var(--mx),var(--my)) scale(0)}}

/* ---- controls ---- */
.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;max-width:1060px}
.btn{position:relative;font:600 11px/1 var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--bg-page);background:var(--accent-ui);border:none;padding:13px 24px;cursor:pointer;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);box-shadow:0 0 18px rgba(79,195,217,.35);transition:transform .16s var(--ease-hud),box-shadow .16s var(--ease-hud)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 26px rgba(79,195,217,.55)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--accent-ui);border:1px solid rgba(79,195,217,.4);box-shadow:none}
.btn.ghost:hover{box-shadow:0 0 16px rgba(79,195,217,.25)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none}
.note{font:500 10px/1.4 var(--font-mono);letter-spacing:.05em;color:var(--text-muted);max-width:360px}
.note b{color:var(--text-secondary);font-weight:600}

@media (prefers-reduced-motion:reduce){.card.lit.rare{animation:none}.card.target::after{animation:none;opacity:.5}}
</style>
</head>
<body>

<div class="head"><span class="ttl">Take a Card</span><span class="rule"></span><span class="cap">MARKET → HAND</span></div>

<div class="panel market"><span class="plab">Night Market</span>
  <div class="mrow">
    <div class="mdeckcol">
      <div class="mdeck">
        <div class="layer l1"></div><div class="layer l2"></div>
        <div class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span class="cnt" id="mcnt">24</span></div>
      </div>
      <span class="k">DECK</span>
    </div>
    <div class="mkt" id="mkt"></div>
  </div>
</div>

<div class="handwrap"><span class="handlab">Operator Hand // <span id="hcnt">4</span></span>
  <div class="hand" id="hand"></div>
</div>

<div class="controls">
  <button class="btn" id="take">◇ Take Highlighted</button>
  <button class="btn ghost" id="reset">Reset</button>
  <span class="note">Or click any market card. It lifts, arcs to your <b>hand</b>, and the fan eases apart; the slot restocks from the deck. Honors reduced-motion.</span>
</div>

<div class="flylayer" id="flylayer"></div>

<script>
const POOL = [
  {n:'AI Cores',   t:'Rare // Data',   v:7, cls:'a-cyan', rare:true,  svg:'<polygon points="20,6 32,13 32,27 20,34 8,27 8,13"/><circle cx="20" cy="20" r="4" fill="var(--rare-cyan)" stroke="none"/>'},
  {n:'Implants',   t:'Rare // Cyber',  v:6, cls:'a-gold', rare:true,  svg:'<circle cx="20" cy="20" r="12"/><circle cx="20" cy="20" r="4" fill="var(--rare-gold)" stroke="none"/>'},
  {n:'Cracked SW', t:'Common // SW',   v:3, cls:'a-grn',  rare:false, svg:'<rect x="9" y="10" width="22" height="20" rx="2"/><path d="M13 16h9M13 20h6"/>'},
  {n:'Corp Data',  t:'Rare // Intel',  v:5, cls:'a-mag',  rare:true,  svg:'<polygon points="20,6 30,13 27,31 20,35 13,31 10,13"/><circle cx="20" cy="20" r="3" fill="var(--rare-magenta)" stroke="none"/>'},
  {n:'Pharma',     t:'Common // Bio',  v:2, cls:'a-pur',  rare:false, svg:'<rect x="15" y="8" width="10" height="6"/><path d="M16 14h8v16a4 4 0 0 1-8 0z"/>'},
  {n:'Weaponry',   t:'Common // Arms', v:2, cls:'a-org',  rare:false, svg:'<rect x="8" y="16" width="24" height="8" rx="2"/><circle cx="28" cy="20" r="2"/>'},
  {n:'Bioware',    t:'Common // Bio',  v:3, cls:'a-grn',  rare:false, svg:'<path d="M20 8v24M14 12l6 5 6-5M14 22l6 5 6-5"/>'},
  {n:'Black Ice',  t:'Rare // Intel',  v:6, cls:'a-mag',  rare:true,  svg:'<polygon points="20,6 33,20 20,34 7,20"/><circle cx="20" cy="20" r="4" fill="var(--rare-magenta)" stroke="none"/>'},
];
const START_MKT  = [0,1,2,3,4,5,6];
const START_HAND = [2,4,5,3];
const strokeFor = c => c.rare
  ? (c.cls==='a-cyan'?'var(--rare-cyan)':c.cls==='a-gold'?'var(--rare-gold)':'var(--rare-magenta)')
  : (c.cls==='a-grn'?'var(--common-green)':c.cls==='a-org'?'var(--common-orange)':'var(--common-purple)');

const EE='cubic-bezier(.34,.08,.16,1)';
const mkt=document.getElementById('mkt'), hand=document.getElementById('hand'),
      flylayer=document.getElementById('flylayer'), mcnt=document.getElementById('mcnt'),
      hcnt=document.getElementById('hcnt'), takeBtn=document.getElementById('take'),
      resetBtn=document.getElementById('reset');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');

let deckN=24, handModel=[], poolPtr=0, busy=false, targetSlot=0;

function cardHTML(c){
  return `<span class="cc"></span>
    <div class="ch"><span class="cn">${c.n}</span><span class="pip">${'<i></i>'.repeat(c.rare?3:1)}</span></div>
    <div class="well"><svg viewBox="0 0 40 40" fill="none" stroke="${strokeFor(c)}" stroke-width="1.4">${c.svg}</svg></div>
    <div class="ft"><span class="ty">${c.t}</span><span class="vl">${c.v}</span></div>
    <span class="strip"></span>`;
}
function makeCard(c,extra=''){
  const el=document.createElement('div');
  el.className=`card lit ${c.cls}${c.rare?' rare':''}${extra?' '+extra:''}`;
  el.innerHTML=cardHTML(c); el._data=c; return el;
}

/* -------- hand fan geometry -------- */
function handTf(i,n){
  const t=i-(n-1)/2, rot=t*6.4, x=t*54, y=Math.pow(Math.abs(t),1.35)*7;
  return `translateX(${x}px) translateY(${y}px) rotate(${rot}deg)`;
}
function layoutHand(animate){
  const cards=[...hand.children], n=cards.length;
  cards.forEach((el,i)=>{
    const tf=handTf(i,n); el._t=tf; el.style.setProperty('--t',tf);
    if(!animate) el.style.transition='none';
    el.style.transform=tf;
    el.style.zIndex=i;
    if(!animate) requestAnimationFrame(()=>el.style.transition='');
  });
}

/* -------- build / reset -------- */
function build(){
  mkt.innerHTML=''; hand.innerHTML=''; flylayer.innerHTML='';
  deckN=24; mcnt.textContent=deckN; poolPtr=0; busy=false; targetSlot=0;
  START_MKT.forEach((idx)=>{
    const slot=document.createElement('div'); slot.className='slot';
    slot.appendChild(makeCard(POOL[idx]));
    mkt.appendChild(slot);
  });
  handModel=[...START_HAND];
  START_HAND.forEach(idx=>hand.appendChild(makeCard(POOL[idx])));
  layoutHand(false);
  hcnt.textContent=hand.children.length;
  markTarget();
}
function markTarget(){
  [...mkt.children].forEach(s=>s.querySelector('.card')?.classList.remove('target'));
  const slots=[...mkt.children].filter(s=>!s.classList.contains('empty'));
  if(!slots.length) return;
  targetSlot=[...mkt.children].indexOf(slots[0]);
  // prefer a rare, else first
  const rareSlot=slots.find(s=>s.querySelector('.card').classList.contains('rare'));
  const pick=rareSlot||slots[0];
  targetSlot=[...mkt.children].indexOf(pick);
  pick.querySelector('.card').classList.add('target');
}

/* -------- dust -------- */
function dust(cx,cy,color){
  for(let k=0;k<6;k++){
    const m=document.createElement('span'); m.className='mote';
    const ang=-Math.PI/2+(Math.random()-.5)*1.9, dist=15+Math.random()*24;
    m.style.setProperty('--mx',Math.cos(ang)*dist+'px');
    m.style.setProperty('--my',(Math.sin(ang)*dist-6)+'px');
    m.style.setProperty('--mc',color);
    m.style.position='fixed';
    m.style.left=(cx-2+(Math.random()-.5)*20)+'px';
    m.style.top=(cy-2+(Math.random()-.5)*22)+'px';
    m.style.animationDelay=(Math.random()*70)+'ms';
    flylayer.appendChild(m); m.addEventListener('animationend',()=>m.remove());
  }
}
function deckGive(faceEl){
  faceEl.animate([{transform:'translateY(0)'},{transform:'translateY(-5px)'},{transform:'translateY(0)'}],{duration:240,easing:'cubic-bezier(.2,.9,.25,1)'});
}
const centerOf=r=>({x:r.left+r.width/2,y:r.top+r.height/2});

/* -------- TAKE: market → hand -------- */
function takeCard(slot){
  if(busy) return;
  const card=slot.querySelector('.card');
  if(!card||slot.classList.contains('empty')) return;
  busy=true; takeBtn.disabled=true;
  const data=card._data;
  card.classList.remove('target');

  if(reduce.matches){
    slot.classList.add('empty');
    handModel.push(data); hand.appendChild(makeCard(data)); layoutHand(false);
    hcnt.textContent=hand.children.length;
    setTimeout(()=>restock(slot),160);
    return;
  }

  const lift=card.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-12px) scale(1.03)'}],{duration:160,easing:EE,fill:'forwards'});
  lift.onfinish=()=>{
    const startRect=card.getBoundingClientRect();
    slot.classList.add('empty');

    // add hidden hand card at its final fan slot to measure the target
    handModel.push(data);
    const handEl=makeCard(data); handEl.style.opacity='0';
    hand.appendChild(handEl);
    layoutHand(true);                    // neighbors ease apart; new one set too
    hcnt.textContent=hand.children.length;
    const n=hand.children.length, idx=n-1;
    handEl.style.transition='none'; handEl.style.transform=handTf(idx,n);
    const targetRect=handEl.getBoundingClientRect();
    requestAnimationFrame(()=>handEl.style.transition='');

    // flyer clone
    const flyer=document.createElement('div'); flyer.className='flyer';
    flyer.style.left=startRect.left+'px'; flyer.style.top=startRect.top+'px';
    flyer.style.width=startRect.width+'px'; flyer.style.height=startRect.height+'px';
    flyer.appendChild(makeCard(data));
    flylayer.appendChild(flyer);

    const s=centerOf(startRect), e=centerOf(targetRect);
    const dx=e.x-s.x, dy=e.y-s.y, rot=(idx-(n-1)/2)*6.4;
    const kf=[
      {offset:0,   transform:`translate(0px,0px) rotate(-3deg) scaleX(1.03) scaleY(1.03)`, filter:'drop-shadow(0 10px 20px rgba(0,0,0,.5))'},
      {offset:.5,  transform:`translate(${dx*0.5}px,${dy*0.5 - 34}px) rotate(${rot*0.5}deg) scaleX(1.015) scaleY(1.015)`, filter:'drop-shadow(0 32px 46px rgba(0,0,0,.5))'},
      {offset:.86, transform:`translate(${dx}px,${dy-6}px) rotate(${rot}deg) scaleX(.985) scaleY(1.05)`, filter:'drop-shadow(0 14px 22px rgba(0,0,0,.48))'},
      {offset:.94, transform:`translate(${dx}px,${dy+3}px) rotate(${rot}deg) scaleX(1.02) scaleY(.965)`, filter:'drop-shadow(0 9px 16px rgba(0,0,0,.45))'},
      {offset:1,   transform:`translate(${dx}px,${dy}px) rotate(${rot}deg) scaleX(1) scaleY(1)`, filter:'drop-shadow(0 6px 12px rgba(0,0,0,.42))'},
    ];
    const fa=flyer.animate(kf,{duration:460,easing:EE,fill:'both'});
    fa.onfinish=()=>{
      flyer.remove();
      handEl.style.opacity='1';
      handEl.animate([{transform:handEl._t+' scale(1.04)'},{transform:handEl._t}],{duration:180,easing:'cubic-bezier(.2,.9,.25,1)'});
      const cc=centerOf(handEl.getBoundingClientRect());
      dust(cc.x,cc.y, data.rare?getComputedStyle(handEl).getPropertyValue('--c'):'rgba(180,210,230,.9)');
      setTimeout(()=>restock(slot),240);
    };
  };
}

/* -------- restock emptied slot from deck -------- */
function restock(slot){
  const data=POOL[(poolPtr++)%POOL.length];
  const card=makeCard(data); card.classList.remove('lit');   // fade lit up on land
  slot.appendChild(card); slot.classList.remove('empty');
  deckN=Math.max(0,deckN-1); mcnt.textContent=deckN;

  if(reduce.matches){ card.classList.add('lit'); finish(); return; }

  const face=document.querySelector('.mdeck .face'); deckGive(face);
  const flyer=document.createElement('div'); flyer.className='flyer';
  const slotRect=slot.getBoundingClientRect();
  flyer.style.left=slotRect.left+'px'; flyer.style.top=slotRect.top+'px';
  flyer.style.width=slotRect.width+'px'; flyer.style.height=slotRect.height+'px';
  const fc=makeCard(data); fc.classList.remove('lit'); flyer.appendChild(fc);
  flylayer.appendChild(flyer);
  card.style.visibility='hidden';

  const dr=document.querySelector('.mdeck').getBoundingClientRect();
  const s=centerOf(dr), e=centerOf(slotRect);
  const dx=s.x-e.x, dy=s.y-e.y;                 // start at deck (offset), land at slot(0,0)
  const kf=[
    {offset:0,   opacity:1, transform:`translate(${dx}px,${dy}px) rotate(-6deg) scaleX(.86) scaleY(.86)`, filter:'drop-shadow(0 8px 16px rgba(0,0,0,.55))'},
    {offset:.5,  opacity:1, transform:`translate(${dx*0.42}px,${dy*0.5 - 40}px) rotate(-2deg) scaleX(.95) scaleY(.95)`, filter:'drop-shadow(0 34px 46px rgba(0,0,0,.5))'},
    {offset:.86, opacity:1, transform:`translate(0px,-9px) rotate(0deg) scaleX(.972) scaleY(1.055)`, filter:'drop-shadow(0 12px 20px rgba(0,0,0,.5))'},
    {offset:.94, opacity:1, transform:`translate(0px,3px) rotate(0deg) scaleX(1.02) scaleY(.965)`, filter:'drop-shadow(0 8px 15px rgba(0,0,0,.46))'},
    {offset:1,   opacity:1, transform:`translate(0,0) rotate(0deg) scaleX(1) scaleY(1)`, filter:'drop-shadow(0 6px 12px rgba(0,0,0,.44))'},
  ];
  const fa=flyer.animate(kf,{duration:420,easing:EE,fill:'both'});
  setTimeout(()=>fc.classList.add('lit'), 420*0.78);
  fa.onfinish=()=>{
    flyer.remove(); card.style.visibility=''; card.classList.add('lit');
    const cc=centerOf(slotRect);
    dust(cc.x,cc.y, data.rare?getComputedStyle(card).getPropertyValue('--c'):'rgba(180,210,230,.9)');
    finish();
  };
}
function finish(){ busy=false; takeBtn.disabled=false; markTarget(); }

/* -------- wire -------- */
mkt.addEventListener('click',e=>{ const slot=e.target.closest('.slot'); if(slot) takeCard(slot); });
takeBtn.addEventListener('click',()=>{ const slot=mkt.children[targetSlot]; if(slot) takeCard(slot); });
resetBtn.addEventListener('click',build);
build();
</script>
