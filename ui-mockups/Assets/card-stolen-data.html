<!-- @dsCard group="Assets" viewport="620x760" name="Card: Stolen Corporate Data (Rare Front)" subtitle="Style anchor — rare-tier card frame, magenta, no baked text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Card — Stolen Corporate Data</title>
<link rel="stylesheet" href="../styles.css">
<style>
:root{ --core:#ff2e88; }
body{margin:0;min-height:100vh;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 50% 36%, #1a0d16 0%, var(--bg-page) 70%);overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:var(--texture-grid);background-size:var(--texture-grid-size);opacity:.5;pointer-events:none}

.card{position:relative;width:380px;height:532px;
  background:linear-gradient(160deg,#111a26 0%,#0b1017 100%);
  clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);
  box-shadow:0 26px 60px rgba(0,0,0,.6), 0 0 34px rgba(255,46,136,.26), 0 0 80px rgba(255,46,136,.1)}

.border{position:absolute;inset:0;clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);
  background:linear-gradient(160deg,#ff2e88,#d61f6f 55%,#ff2e88);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px;
  filter:drop-shadow(0 0 4px rgba(255,46,136,.7))}
.frame-in{position:absolute;inset:12px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  border:1px solid rgba(255,46,136,.3);pointer-events:none}
.frame-in::before{content:"";position:absolute;inset:5px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  border:1px solid rgba(255,46,136,.12)}

.cn{position:absolute;width:34px;height:34px;pointer-events:none}
.cn::before,.cn::after{content:"";position:absolute;background:var(--core);box-shadow:0 0 6px rgba(255,46,136,.7)}
.cn::before{width:20px;height:2px}.cn::after{width:2px;height:20px}
.cn.tl{top:16px;left:16px}.cn.tl::before{top:0;left:0}.cn.tl::after{top:0;left:0}
.cn.tr{top:16px;right:16px}.cn.tr::before{top:0;right:0}.cn.tr::after{top:0;right:0}
.cn.bl{bottom:16px;left:16px}.cn.bl::before{bottom:0;left:0}.cn.bl::after{bottom:0;left:0}
.cn.br{bottom:16px;right:16px}.cn.br::before{bottom:0;right:0}.cn.br::after{bottom:0;right:0}
.stud{position:absolute;width:6px;height:6px;background:var(--core);transform:rotate(45deg);box-shadow:0 0 6px rgba(255,46,136,.9);pointer-events:none}
.stud.tl{top:26px;left:26px}.stud.tr{top:26px;right:26px}.stud.bl{bottom:26px;left:26px}.stud.br{bottom:26px;right:26px}

.name{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:280px;height:44px;
  background:linear-gradient(#1a0e15,#140a11);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);
  border:1px solid rgba(255,46,136,.45);box-shadow:0 0 12px rgba(255,46,136,.2), inset 0 0 10px rgba(0,0,0,.6);
  display:grid;place-items:center}
.name span{font:600 8px/1 var(--font-display);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,46,136,.35)}

.illus{position:absolute;top:88px;left:26px;right:26px;bottom:96px;
  background:radial-gradient(circle at 50% 42%, #200a16 0%, #0a050b 72%);
  border:1px solid rgba(255,46,136,.25);overflow:hidden;display:grid;place-items:center}
.illus::before{content:"";position:absolute;inset:0;background:var(--texture-scanline);opacity:.5}
.ring{position:absolute;border-radius:50%;border:1px solid transparent}
.r1{width:210px;height:210px;border-top-color:rgba(255,46,136,.45);border-right-color:rgba(255,46,136,.16);animation:spin 9s linear infinite}
.r2{width:250px;height:250px;border:1px dashed rgba(255,46,136,.2);animation:spin 17s linear infinite reverse}
.shard{position:relative;filter:drop-shadow(0 0 15px rgba(255,46,136,.75));animation:pulse 3.3s var(--ease-hud) infinite}
.glyphs{font:700 11px/1 var(--font-mono);letter-spacing:2px;fill:rgba(255,180,214,.75)}

.type{position:absolute;bottom:32px;left:30px;font:600 7px/1 var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)}
.value{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.value .v{font:600 30px/1 var(--font-mono);color:var(--core);text-shadow:0 0 12px rgba(255,46,136,.9)}
.value .u{font:600 8px/1.3 var(--font-display);letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
.tier{position:absolute;bottom:30px;right:30px;font:600 7px/1 var(--font-display);letter-spacing:.2em;text-transform:uppercase;
  color:var(--core);border:1px solid rgba(255,46,136,.5);padding:4px 7px;box-shadow:0 0 8px rgba(255,46,136,.3)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 11px rgba(255,46,136,.55))}50%{filter:drop-shadow(0 0 22px rgba(255,46,136,.95))}}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(15px)}}
</style></head><body>

<div class="card">
  <div class="border"></div>
  <div class="frame-in"></div>
  <div class="cn tl"></div><div class="cn tr"></div><div class="cn bl"></div><div class="cn br"></div>
  <div class="stud tl"></div><div class="stud tr"></div><div class="stud bl"></div><div class="stud br"></div>

  <div class="name"><span>Card name</span></div>

  <div class="illus">
    <div class="ring r2"></div><div class="ring r1"></div>
    <div class="shard">
      <svg viewBox="0 0 200 200" width="196" height="196">
        <defs>
          <linearGradient id="shardg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffd6e8"/><stop offset="30%" stop-color="#ff5fa2"/>
            <stop offset="70%" stop-color="#c81e6c"/><stop offset="100%" stop-color="#3d0a22"/>
          </linearGradient>
          <clipPath id="shardClip"><polygon points="100,24 148,58 136,158 100,182 64,158 52,58"/></clipPath>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6"/></filter>
        </defs>
        <polygon points="100,24 148,58 136,158 100,182 64,158 52,58" transform="translate(-5 3)" fill="rgba(60,220,255,.18)"/>
        <polygon points="100,24 148,58 136,158 100,182 64,158 52,58" transform="translate(5 -2)" fill="rgba(255,46,136,.2)"/>
        <polygon points="100,24 148,58 136,158 100,182 64,158 52,58" fill="url(#shardg)"/>
        <g clip-path="url(#shardClip)">
          <g class="glyphs" style="animation:scan 2.2s linear infinite">
            <text x="56" y="52">01001</text><text x="56" y="66">10 電子</text>
            <text x="58" y="80">110100</text><text x="56" y="94">0x9F 侵</text>
            <text x="58" y="108">01110</text><text x="56" y="122">情報 011</text>
            <text x="60" y="136">10011</text><text x="60" y="150">0101 数</text>
            <text x="62" y="164">1101</text><text x="62" y="178">機密</text>
          </g>
          <g stroke="rgba(255,255,255,.12)" stroke-width="1">
            <line x1="52" y1="72" x2="148" y2="72"/><line x1="52" y1="104" x2="148" y2="104"/>
            <line x1="52" y1="136" x2="148" y2="136"/><line x1="52" y1="168" x2="148" y2="168"/>
          </g>
        </g>
        <polyline points="100,24 100,182" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
        <polygon points="100,24 148,58 136,158 100,182 64,158 52,58" fill="none" stroke="rgba(255,180,214,.85)" stroke-width="1.5"/>
        <polygon points="100,24 100,182 64,158 52,58" fill="rgba(255,255,255,.10)"/>
        <circle cx="100" cy="100" r="7" fill="#ffffff" filter="url(#soft)"/>
      </svg>
    </div>
  </div>

  <div class="type">Rare // Intel</div>
  <div class="value"><span class="v">5</span><span class="u">PTS</span></div>
  <div class="tier">Rare</div>
</div>

</body></html>
