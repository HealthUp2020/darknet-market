<!-- @dsCard group="Assets" viewport="720x320" name="Panel: Bot Stats (Compact / Locked)" subtitle="Style anchor — dimmed glass, hidden-info lock overlay" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bot Stats Panel</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 50% 40%, #0d1420 0%, var(--bg-page) 72%);overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:var(--texture-grid);background-size:var(--texture-grid-size);opacity:.5;pointer-events:none}

/* dimmer than the player panel: lower opacity, muted border, no active glow */
.panel{position:relative;width:560px;
  background:rgba(16,21,29,.6);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  clip-path:var(--clip-panel);
  border:1px solid rgba(79,195,217,.22);
  box-shadow:var(--shadow-panel);filter:saturate(.85)}
.scan{position:absolute;inset:0;background:var(--texture-scanline);opacity:.5;pointer-events:none;clip-path:var(--clip-panel)}
/* static-noise veil over the whole panel */
.noise{position:absolute;inset:0;pointer-events:none;clip-path:var(--clip-panel);opacity:.5;mix-blend-mode:overlay;
  background-image:repeating-radial-gradient(circle at 0 0,rgba(255,255,255,.08) 0 1px,transparent 1px 2px),
    repeating-radial-gradient(circle at 7px 4px,rgba(120,140,160,.09) 0 1px,transparent 1px 3px);
  background-size:5px 5px,9px 9px;animation:jitter .5s steps(3) infinite}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;border-bottom:1px solid var(--border-subtle)}
.head .id{display:flex;align-items:center;gap:9px}
.avatar{width:26px;height:26px;clip-path:polygon(20% 0,100% 0,100% 80%,80% 100%,0 100%,0 20%);
  background:linear-gradient(150deg,#161e28,#0b1017);border:1px solid rgba(79,195,217,.3);display:grid;place-items:center}
.avatar svg{width:13px;height:13px;color:var(--text-muted)}
.namez{width:120px;height:9px;border-radius:2px;background:linear-gradient(90deg,rgba(146,165,188,.25),transparent)}
/* status: THINKING dots instead of active turn */
.status{display:inline-flex;align-items:center;gap:4px}
.status i{width:5px;height:5px;border-radius:50%;background:var(--text-muted)}
.status i:nth-child(1){animation:blink 1.2s .0s infinite}
.status i:nth-child(2){animation:blink 1.2s .2s infinite}
.status i:nth-child(3){animation:blink 1.2s .4s infinite}

.body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border-subtle)}
.zone{position:relative;background:rgba(9,12,19,.6);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-height:72px}
.zlabel{display:flex;align-items:center;gap:6px}
.zlabel svg{width:13px;height:13px;color:var(--text-secondary)}
.zlabel .lz{width:54px;height:6px;border-radius:2px;background:rgba(146,165,188,.25)}
.slot{display:flex;align-items:baseline;gap:6px}
.num{min-width:44px;height:32px;border:1px dashed rgba(79,195,217,.32);border-radius:2px;display:grid;place-items:center;background:rgba(79,195,217,.04)}
.num b{font:600 18px/1 var(--font-mono);color:rgba(79,195,217,.3)}
.unit{width:22px;height:7px;border-radius:2px;background:rgba(86,106,132,.35)}
/* hand zone is the hidden one: obscured with lock, no number box shown */
.zone.hidden .num{border-style:solid;border-color:rgba(86,106,132,.4);background:repeating-linear-gradient(45deg,rgba(40,50,62,.5) 0 4px,transparent 4px 8px)}
.zone.hidden .num b{color:transparent}
.lock{position:absolute;top:8px;right:8px;width:18px;height:18px;color:var(--text-muted)}
.lock svg{width:100%;height:100%}

.foot{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--border-subtle)}
.meter{flex:1;height:5px;border-radius:3px;background:rgba(9,12,19,.7);overflow:hidden;border:1px solid var(--border-subtle)}
.meter i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#2e5964,var(--accent-ui-dim))}
.foot .cap{width:50px;height:6px;border-radius:2px;background:rgba(146,165,188,.22)}

@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes jitter{0%{transform:translate(0,0)}33%{transform:translate(-1px,1px)}66%{transform:translate(1px,-1px)}100%{transform:translate(0,0)}}
</style></head><body>

<div class="panel">
  <div class="scan"></div>
  <div class="noise"></div>

  <div class="head">
    <div class="id">
      <div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></div>
      <div class="namez"></div>
    </div>
    <div class="status"><i></i><i></i><i></i></div>
  </div>

  <div class="body">
    <div class="zone hidden">
      <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
      <div class="zlabel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8l8-4 8 4-8 4-8-4z"/><path d="M4 8v8l8 4 8-4V8"/></svg>
        <span class="lz"></span>
      </div>
      <div class="slot"><div class="num"><b>?</b></div></div>
    </div>

    <div class="zone">
      <div class="zlabel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="6" width="14" height="9" rx="2"/><path d="M8 15v3M16 15v3M9 10h6"/></svg>
        <span class="lz"></span>
      </div>
      <div class="slot"><div class="num"><b>—</b></div><div class="unit"></div></div>
    </div>

    <div class="zone">
      <div class="zlabel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg>
        <span class="lz"></span>
      </div>
      <div class="slot"><div class="num"><b>—</b></div><div class="unit"></div></div>
    </div>
  </div>

  <div class="foot">
    <div class="cap"></div>
    <div class="meter"><i></i></div>
  </div>
</div>

</body></html>
