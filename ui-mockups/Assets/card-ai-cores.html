<!-- @dsCard group="Assets" viewport="620x760" name="Card: AI Cores (Rare Front)" subtitle="Style anchor — rare-tier card frame, cyan, no baked text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Card — AI Cores</title>
<link rel="stylesheet" href="../styles.css">
<style>
:root{ --core:#00fff0; }
body{margin:0;min-height:100vh;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 50% 36%, #0d1420 0%, var(--bg-page) 70%);overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:var(--texture-grid);background-size:var(--texture-grid-size);opacity:.5;pointer-events:none}

.card{position:relative;width:380px;height:532px;
  background:linear-gradient(160deg,#111a26 0%,#0b1017 100%);
  clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);
  box-shadow:0 26px 60px rgba(0,0,0,.6), 0 0 34px rgba(0,255,240,.28), 0 0 80px rgba(0,255,240,.12)}

/* rare cyan glowing border */
.border{position:absolute;inset:0;clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);
  background:linear-gradient(160deg,#00fff0,#0bb9c6 55%,#00fff0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px;
  filter:drop-shadow(0 0 4px rgba(0,255,240,.7))}
/* inner ornate hairline frame */
.frame-in{position:absolute;inset:12px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  border:1px solid rgba(0,255,240,.32);pointer-events:none}
.frame-in::before{content:"";position:absolute;inset:5px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  border:1px solid rgba(0,255,240,.12)}

/* ornate corner brackets (rare-only) */
.cn{position:absolute;width:34px;height:34px;pointer-events:none}
.cn::before,.cn::after{content:"";position:absolute;background:var(--core);box-shadow:0 0 6px rgba(0,255,240,.7)}
.cn::before{width:20px;height:2px}.cn::after{width:2px;height:20px}
.cn.tl{top:16px;left:16px}.cn.tl::before{top:0;left:0}.cn.tl::after{top:0;left:0}
.cn.tr{top:16px;right:16px}.cn.tr::before{top:0;right:0}.cn.tr::after{top:0;right:0}
.cn.bl{bottom:16px;left:16px}.cn.bl::before{bottom:0;left:0}.cn.bl::after{bottom:0;left:0}
.cn.br{bottom:16px;right:16px}.cn.br::before{bottom:0;right:0}.cn.br::after{bottom:0;right:0}
/* small diamond studs on corners */
.stud{position:absolute;width:6px;height:6px;background:var(--core);transform:rotate(45deg);box-shadow:0 0 6px rgba(0,255,240,.9);pointer-events:none}
.stud.tl{top:26px;left:26px}.stud.tr{top:26px;right:26px}.stud.bl{bottom:26px;left:26px}.stud.br{bottom:26px;right:26px}

/* name label plate (empty — no baked text) */
.name{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:280px;height:44px;
  background:linear-gradient(#0e1a22,#0a141c);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);
  border:1px solid rgba(0,255,240,.45);box-shadow:0 0 12px rgba(0,255,240,.22), inset 0 0 10px rgba(0,0,0,.6);
  display:grid;place-items:center}
.name span{font:600 8px/1 var(--font-display);letter-spacing:.3em;text-transform:uppercase;color:rgba(0,255,240,.35)}

/* illustration well */
.illus{position:absolute;top:88px;left:26px;right:26px;bottom:96px;
  background:radial-gradient(circle at 50% 42%, #0a2027 0%, #050b12 72%);
  border:1px solid rgba(0,255,240,.25);overflow:hidden;display:grid;place-items:center}
.illus::before{content:"";position:absolute;inset:0;background:var(--texture-scanline);opacity:.5}
/* holographic rings behind crystal */
.ring{position:absolute;border-radius:50%;border:1px solid transparent}
.r1{width:210px;height:210px;border-top-color:rgba(0,255,240,.5);border-right-color:rgba(0,255,240,.18);animation:spin 8s linear infinite}
.r2{width:250px;height:250px;border:1px dashed rgba(0,255,240,.22);animation:spin 16s linear infinite reverse}
.crystal{position:relative;filter:drop-shadow(0 0 16px rgba(0,255,240,.8));animation:pulse 3.2s var(--ease-hud) infinite}

/* value plate bottom */
.value{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px}
.value .v{font:600 30px/1 var(--font-mono);color:var(--core);text-shadow:0 0 12px rgba(0,255,240,.9)}
.value .u{font:600 8px/1.3 var(--font-display);letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
.tier{position:absolute;bottom:30px;right:30px;font:600 7px/1 var(--font-display);letter-spacing:.2em;text-transform:uppercase;
  color:var(--core);border:1px solid rgba(0,255,240,.5);padding:4px 7px;box-shadow:0 0 8px rgba(0,255,240,.3)}
.type{position:absolute;bottom:32px;left:30px;font:600 7px/1 var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 12px rgba(0,255,240,.6))}50%{filter:drop-shadow(0 0 24px rgba(0,255,240,1))}}
</style></head><body>

<div class="card">
  <div class="border"></div>
  <div class="frame-in"></div>
  <div class="cn tl"></div><div class="cn tr"></div><div class="cn bl"></div><div class="cn br"></div>
  <div class="stud tl"></div><div class="stud tr"></div><div class="stud bl"></div><div class="stud br"></div>

  <div class="name"><span>Card name</span></div>

  <div class="illus">
    <div class="ring r2"></div><div class="ring r1"></div>
    <div class="crystal">
      <svg viewBox="0 0 200 200" width="196" height="196">
        <defs>
          <radialGradient id="crystal" cx="42%" cy="36%" r="70%">
            <stop offset="0%" stop-color="#e9ffff"/><stop offset="26%" stop-color="#7ff6f0"/>
            <stop offset="60%" stop-color="#12b7c4"/><stop offset="100%" stop-color="#053b45"/>
          </radialGradient>
          <radialGradient id="tableg" cx="45%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#8dfff8"/><stop offset="100%" stop-color="#00d9e0"/>
          </radialGradient>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
          <clipPath id="hexClip"><polygon points="100,30 158,66 158,134 100,170 42,134 42,66"/></clipPath>
        </defs>
        <polygon points="100,30 158,66 158,134 100,170 42,134 42,66" fill="url(#crystal)"/>
        <g stroke="rgba(0,255,240,.55)" stroke-width="1" fill="none">
          <line x1="100" y1="30" x2="100" y2="100"/><line x1="158" y1="66" x2="100" y2="100"/>
          <line x1="158" y1="134" x2="100" y2="100"/><line x1="100" y1="170" x2="100" y2="100"/>
          <line x1="42" y1="134" x2="100" y2="100"/><line x1="42" y1="66" x2="100" y2="100"/>
        </g>
        <g clip-path="url(#hexClip)" stroke="rgba(0,255,240,.5)" stroke-width="1" fill="none" opacity=".85">
          <path d="M56,82 H86 V68 M86,82 H122 M122,68 V96 H146"/>
          <path d="M58,122 H82 V136 M82,122 H108 V106 M108,122 H144"/>
          <path d="M100,48 V68 M100,152 V132"/>
          <g fill="var(--core)" stroke="none">
            <rect x="84" y="80" width="4" height="4"/><rect x="120" y="66" width="4" height="4"/>
            <rect x="144" y="94" width="4" height="4"/><rect x="80" y="120" width="4" height="4"/>
            <rect x="106" y="104" width="4" height="4"/><rect x="142" y="120" width="4" height="4"/>
          </g>
        </g>
        <polygon points="100,66 128,82 128,118 100,134 72,118 72,82" fill="url(#tableg)" filter="url(#soft)" opacity=".95"/>
        <circle cx="100" cy="100" r="8" fill="#ffffff" filter="url(#soft)"/>
        <polygon points="100,38 132,56 108,72 82,62" fill="rgba(255,255,255,.5)"/>
      </svg>
    </div>
  </div>

  <div class="type">Rare // Data</div>
  <div class="value"><span class="v">7</span><span class="u">PTS</span></div>
  <div class="tier">Rare</div>
</div>

</body></html>
