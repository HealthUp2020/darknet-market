<!-- @dsCard group="Assets" viewport="560x600" name="Panel: Action Log / Terminal" subtitle="Style anchor — hacker terminal log, empty content area" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Action Log Panel</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 50% 40%, #0d1420 0%, var(--bg-page) 72%);overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:var(--texture-grid);background-size:var(--texture-grid-size);opacity:.5;pointer-events:none}

.log{position:relative;width:400px;height:500px;box-sizing:border-box;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(13,20,28,.92),rgba(6,10,16,.96));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border-panel);border-top:2px solid var(--accent-ui);
  clip-path:polygon(0 0,100% 0,100% 100%,12px 100%,0 calc(100% - 12px));
  box-shadow:0 0 18px rgba(79,195,217,.14),var(--shadow-panel)}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 14px;border-bottom:1px solid var(--border-subtle);background:rgba(79,195,217,.05)}
.head .pl{display:flex;align-items:center;gap:8px}
.prompt{font:600 13px/1 var(--font-mono);color:var(--accent-ui);text-shadow:var(--glow-text-ui)}
.prompt .car{animation:ds-blink-caret 1s step-end infinite}
.head .titlez{width:96px;height:8px;border-radius:2px;background:linear-gradient(90deg,rgba(79,195,217,.3),transparent)}
.head .dots{display:flex;gap:5px}
.head .dots i{width:5px;height:5px;border-radius:50%;background:var(--border-panel)}
.head .dots i:first-child{background:var(--accent-ui-dim)}

/* body — empty scrollable console area */
.body{position:relative;flex:1;overflow:hidden;padding:12px 14px}
.scan{position:absolute;inset:0;background:var(--texture-scanline);opacity:.55;pointer-events:none}
/* left gutter line-number rail */
.gutter{position:absolute;top:0;bottom:0;left:0;width:30px;border-right:1px solid var(--border-subtle);
  background:rgba(255,255,255,.015);display:flex;flex-direction:column;gap:14px;padding:12px 0 0;align-items:center}
.gutter b{font:500 9px/1 var(--font-mono);color:rgba(86,106,132,.5)}
/* reserved empty log rows */
.rows{position:relative;margin-left:36px;display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:center;gap:8px}
.line .gt{font:600 10px/1 var(--font-mono);color:rgba(79,195,217,.5)}
.line .bar{height:8px;border-radius:2px;background:linear-gradient(90deg,rgba(146,165,188,.22),rgba(146,165,188,.04))}
.line .bar.w1{width:70%}.line .bar.w2{width:48%}.line .bar.w3{width:82%}.line .bar.w4{width:38%}
.line.acc .bar{background:linear-gradient(90deg,rgba(79,195,217,.32),rgba(79,195,217,.05))}
/* active input line */
.input{display:flex;align-items:center;gap:8px;margin-top:4px}
.input .gt{font:600 10px/1 var(--font-mono);color:var(--accent-ui)}
.input .car{width:7px;height:14px;background:var(--accent-ui);box-shadow:var(--glow-ui);animation:ds-blink-caret 1s step-end infinite}

/* footer status strip */
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 14px;border-top:1px solid var(--border-subtle);background:rgba(10,14,22,.6)}
.foot .lz{width:70px;height:6px;border-radius:2px;background:rgba(86,106,132,.35)}
.foot .st{display:inline-flex;align-items:center;gap:5px}
.foot .st i{width:5px;height:5px;border-radius:50%;background:var(--accent-ui);box-shadow:var(--glow-ui);animation:ds-pulse 1.8s infinite}
.foot .st b{font:500 8px/1 var(--font-mono);letter-spacing:.1em;color:var(--text-muted)}
</style></head><body>

<div class="log">
  <div class="head">
    <div class="pl"><span class="prompt">&gt;_<span class="car">|</span></span><span class="titlez"></span></div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>

  <div class="body">
    <div class="scan"></div>
    <div class="gutter"><b>01</b><b>02</b><b>03</b><b>04</b><b>05</b><b>06</b><b>07</b><b>08</b></div>
    <div class="rows">
      <div class="line"><span class="gt">&gt;</span><span class="bar w1"></span></div>
      <div class="line acc"><span class="gt">&gt;</span><span class="bar w3"></span></div>
      <div class="line"><span class="gt">&gt;</span><span class="bar w2"></span></div>
      <div class="line"><span class="gt">&gt;</span><span class="bar w3"></span></div>
      <div class="line acc"><span class="gt">&gt;</span><span class="bar w4"></span></div>
      <div class="line"><span class="gt">&gt;</span><span class="bar w2"></span></div>
      <div class="line"><span class="gt">&gt;</span><span class="bar w1"></span></div>
      <div class="input"><span class="gt">&gt;</span><span class="car"></span></div>
    </div>
  </div>

  <div class="foot">
    <span class="lz"></span>
    <span class="st"><i></i><b>LIVE</b></span>
  </div>
</div>

</body></html>
