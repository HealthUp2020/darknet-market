<!-- @dsCard group="Spacing & Layout" viewport="700x170" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.r{display:flex;align-items:center;gap:12px}
.bar{height:14px;background:var(--accent-ui-glass);border:1px solid rgba(79,195,217,.45)}
.t{font:500 9px/1 var(--font-mono);color:var(--text-muted);width:150px;flex-shrink:0}</style></head><body>
<div style="display:flex;flex-direction:column;gap:6px">
  <div class="r"><span class="t">space-1 · 4px — icon gaps</span><div class="bar" style="width:4px"></div></div>
  <div class="r"><span class="t">space-2 · 8px — inside chips</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="t">space-3 · 12px — card row gap</span><div class="bar" style="width:12px"></div></div>
  <div class="r"><span class="t">space-4 · 16px — panel padding</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="t">space-5 · 24px — HUD gap, margins</span><div class="bar" style="width:24px"></div></div>
  <div class="r"><span class="t">space-6 · 32px — section gap</span><div class="bar" style="width:32px"></div></div>
  <div class="r"><span class="t">space-7 · 48px — stage separation</span><div class="bar" style="width:48px"></div></div>
</div>
</body></html>
