<!-- @dsCard group="Colors" viewport="700x170" name="Base / Neutral" subtitle="Tech-noir navy foundation — calm, legible" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
body{display:flex;gap:10px;padding:16px;align-items:stretch}
.sw{flex:1;display:flex;flex-direction:column;gap:5px}
.chip{height:52px;border:1px solid var(--border-subtle)}
.n{font:600 9px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary)}
.h{font:500 9px/1 var(--font-mono);color:var(--text-muted)}
.u{font:400 9px/1.3 var(--font-body);color:var(--text-muted)}
</style></head><body>
<div class="sw"><div class="chip" style="background:var(--bg-page)"></div><div class="n">bg-page</div><div class="h">#0A0E16</div><div class="u">board background</div></div>
<div class="sw"><div class="chip" style="background:var(--bg-panel)"></div><div class="n">bg-panel</div><div class="h">#141A24</div><div class="u">panels, cards</div></div>
<div class="sw"><div class="chip" style="background:var(--bg-inset)"></div><div class="n">bg-inset</div><div class="h">#070A10</div><div class="u">wells, log screen</div></div>
<div class="sw"><div class="chip" style="background:var(--border-panel)"></div><div class="n">border-panel</div><div class="h">#26334A</div><div class="u">1px borders</div></div>
<div class="sw"><div class="chip" style="background:var(--bg-panel);display:grid;place-items:center"><span style="font:600 20px var(--font-display);color:var(--text-primary)">Aa</span></div><div class="n">text-primary</div><div class="h">#E6EEF7</div><div class="u">primary text</div></div>
<div class="sw"><div class="chip" style="background:var(--bg-panel);display:grid;place-items:center"><span style="font:600 20px var(--font-display);color:var(--text-secondary)">Aa</span></div><div class="n">text-secondary</div><div class="h">#92A5BC</div><div class="u">descriptions</div></div>
<div class="sw"><div class="chip" style="background:var(--bg-panel);display:grid;place-items:center"><span style="font:600 20px var(--font-display);color:var(--text-muted)">Aa</span></div><div class="n">text-muted</div><div class="h">#566A84</div><div class="u">labels, hints</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-ui)"></div><div class="n">accent-ui</div><div class="h">#4FC3D9</div><div class="u">interactive / focus</div></div>
</body></html>
