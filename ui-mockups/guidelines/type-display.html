<!-- @dsCard group="Type" viewport="700x190" name="Display & Labels" subtitle="Chakra Petch — ALL CAPS, tracked" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;gap:16px}
.spec{font:500 9px/1 var(--font-mono);color:var(--text-muted);width:210px;flex-shrink:0}
</style></head><body>
<div class="row"><span class="spec">display · 28/600 · caps · +0.06em</span><span style="font:var(--type-display);letter-spacing:var(--track-display);text-transform:uppercase">Night Market</span></div>
<div class="row"><span class="spec">heading · 18/600 · caps · +0.08em</span><span style="font:var(--type-heading);letter-spacing:var(--track-heading);text-transform:uppercase;color:var(--text-primary)">Market // Row</span></div>
<div class="row"><span class="spec">label · 11/600 · caps · +0.18em</span><span style="font:var(--type-label);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-secondary)">Operator credits</span></div>
<div style="font:var(--type-caption);color:var(--text-muted);border-top:1px solid var(--border-subtle);padding-top:10px">Headings and labels are always ALL CAPS. Separators: <span style="font-family:var(--font-mono)">//</span> between label segments. Never bold above 600.</div>
</body></html>
