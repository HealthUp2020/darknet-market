<!-- @dsCard group="Type" viewport="700x190" name="Data & Terminal" subtitle="IBM Plex Mono — every number on screen" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;display:flex;gap:32px}
.spec{font:500 9px/1 var(--font-mono);color:var(--text-muted);margin-bottom:6px}</style></head><body>
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
  <div><div class="spec">data-lg · 26/600 mono — scores, credits</div>
    <span style="font:var(--type-data-lg);color:var(--text-primary)">12,480 <span style="font-size:14px;color:var(--accent-ui)">CR</span></span></div>
  <div><div class="spec">data · 14/500 mono — counters, values</div>
    <span style="font:var(--type-data);color:var(--text-primary)">HAND 6/7 &nbsp;·&nbsp; DECK 31 &nbsp;·&nbsp; RND 04</span></div>
</div>
<div style="flex:1.2">
  <div class="spec">terminal · 12/400 mono · 1.7 — log panel</div>
  <div style="background:var(--bg-inset);border:1px solid var(--border-subtle);padding:10px 12px;font:var(--type-terminal)">
    <div style="color:var(--text-secondary)">&gt; vult-3r sold 3&times; synth-silk &nbsp;+6 cr</div>
    <div style="color:var(--text-secondary)">&gt; nomad took 1&times; datashard</div>
    <div style="color:var(--accent-ui)">&gt; your turn, operator<span style="animation:ds-blink-caret 1s step-end infinite">_</span></div>
  </div>
</div>
</body></html>
