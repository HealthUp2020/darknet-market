<!-- @dsCard group="Effects & States" viewport="700x180" name="Glow Spec" subtitle="3-layer bloom — rarity signal only" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px 20px;display:flex;gap:28px;align-items:flex-start}
.u{font:400 9px/1.4 var(--font-body);color:var(--text-secondary);margin-top:10px}
.n{font:500 9px/1.4 var(--font-mono);color:var(--text-muted)}</style></head><body>
<div style="flex:1">
  <div style="display:flex;gap:24px">
    <div style="width:70px;height:56px;border:1px solid var(--rare-cyan);background:var(--rare-cyan-glass);box-shadow:var(--glow-cyan)"></div>
    <div style="width:70px;height:56px;border:1px solid var(--rare-gold);background:var(--rare-gold-glass);box-shadow:var(--glow-gold)"></div>
    <div style="width:70px;height:56px;border:1px solid var(--rare-magenta);background:var(--rare-magenta-glass);box-shadow:var(--glow-magenta)"></div>
  </div>
  <div class="u">Rarity glow: rare tier elements only, permanent.</div>
</div>
<div style="flex:1">
  <div style="display:flex;gap:24px;align-items:center">
    <div style="width:70px;height:56px;border:1px solid var(--accent-ui);background:var(--accent-ui-glass);box-shadow:var(--glow-ui)"></div>
    <div class="n">core 6px / .55<br>bloom 20px / .28<br>wash 48px / .12</div>
  </div>
  <div class="u">UI glow (softer, 2-layer): selection, focus, active turn. Never on common-tier accents, never on body text.</div>
</div>
</body></html>
