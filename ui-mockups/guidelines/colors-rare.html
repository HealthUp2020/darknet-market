<!-- @dsCard group="Colors" viewport="700x180" name="Rare Tier" subtitle="Neon accents — ALWAYS paired with glow" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
body{display:flex;gap:24px;padding:24px 20px}
.sw{flex:1;display:flex;flex-direction:column;gap:7px}
.chip{height:64px;display:grid;place-items:center}
.n{font:600 10px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase}
.h{font:500 9px/1 var(--font-mono);color:var(--text-muted)}
.u{font:400 9px/1.4 var(--font-body);color:var(--text-secondary)}
</style></head><body>
<div class="sw">
  <div class="chip" style="background:var(--rare-cyan-glass);border:1px solid var(--rare-cyan);box-shadow:var(--glow-cyan)"><span style="font:600 11px var(--font-mono);color:var(--rare-cyan)">#00E5FF</span></div>
  <div class="n" style="color:var(--rare-cyan)">rare-cyan</div><div class="h">glow: --glow-cyan</div><div class="u">Data / intel goods, highest-tier tech</div>
</div>
<div class="sw">
  <div class="chip" style="background:var(--rare-gold-glass);border:1px solid var(--rare-gold);box-shadow:var(--glow-gold)"><span style="font:600 11px var(--font-mono);color:var(--rare-gold)">#FFC94D</span></div>
  <div class="n" style="color:var(--rare-gold)">rare-gold</div><div class="h">glow: --glow-gold</div><div class="u">Luxury goods, bonus rewards</div>
</div>
<div class="sw">
  <div class="chip" style="background:var(--rare-magenta-glass);border:1px solid var(--rare-magenta);box-shadow:var(--glow-magenta)"><span style="font:600 11px var(--font-mono);color:var(--rare-magenta)">#FF2D96</span></div>
  <div class="n" style="color:var(--rare-magenta)">rare-magenta</div><div class="h">glow: --glow-magenta</div><div class="u">Contraband, the seal, one-of-a-kind</div>
</div>
</body></html>
