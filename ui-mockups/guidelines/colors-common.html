<!-- @dsCard group="Colors" viewport="700x160" name="Common Tier" subtitle="Matte accents — never glow" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
body{display:flex;gap:24px;padding:20px}
.sw{flex:1;display:flex;flex-direction:column;gap:7px}
.chip{height:56px;display:grid;place-items:center}
.n{font:600 10px/1.2 var(--font-display);letter-spacing:.12em;text-transform:uppercase}
.h{font:500 9px/1 var(--font-mono);color:var(--text-muted)}
.u{font:400 9px/1.4 var(--font-body);color:var(--text-secondary)}
</style></head><body>
<div class="sw">
  <div class="chip" style="background:var(--common-purple-glass);border:1px solid color-mix(in srgb,var(--common-purple) 55%,transparent)"><span style="font:600 11px var(--font-mono);color:var(--common-purple)">#8578AD</span></div>
  <div class="n" style="color:var(--common-purple)">common-purple</div><div class="h">border at 55% opacity</div><div class="u">Synth-textiles</div>
</div>
<div class="sw">
  <div class="chip" style="background:var(--common-green-glass);border:1px solid color-mix(in srgb,var(--common-green) 55%,transparent)"><span style="font:600 11px var(--font-mono);color:var(--common-green)">#6FA07D</span></div>
  <div class="n" style="color:var(--common-green)">common-green</div><div class="h">border at 55% opacity</div><div class="u">Stims / bioware</div>
</div>
<div class="sw">
  <div class="chip" style="background:var(--common-orange-glass);border:1px solid color-mix(in srgb,var(--common-orange) 55%,transparent)"><span style="font:600 11px var(--font-mono);color:var(--common-orange)">#B97A4B</span></div>
  <div class="n" style="color:var(--common-orange)">common-orange</div><div class="h">border at 55% opacity</div><div class="u">Scrap / salvage</div>
</div>
</body></html>
