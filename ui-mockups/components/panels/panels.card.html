<!-- @dsCard group="Components" viewport="700x250" name="Glass Panels" subtitle="Stat panels + terminal log; active = turn signal" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>window.__dsReady=new Promise(function(r){var s=document.createElement('script');s.src='../../_ds_bundle.js';s.onload=r;s.onerror=r;document.head.appendChild(s)});</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>body{background:var(--bg-page)}#bg{position:fixed;inset:0;background:var(--texture-grid);background-size:var(--texture-grid-size)}</style>
</head><body><div id="bg"></div><div id="root" style="position:relative;padding:20px"></div>
<script type="text/babel">
window.__dsReady.then(()=>{
const NS=(()=>{for(const k of Object.getOwnPropertyNames(window)){try{const v=window[k];if(v&&typeof v==='object'&&v.Button&&v.GameCard)return v}catch(e){}}return{}})();
const {GlassPanel}=NS;
const Stat=({l,v,c})=>(
  <div style={{display:'flex',flexDirection:'column',gap:3}}>
    <span style={{font:'600 8px/1 var(--font-display)',letterSpacing:'.18em',color:'var(--text-muted)'}}>{l}</span>
    <span style={{font:'600 20px/1 var(--font-mono)',color:c||'var(--text-primary)'}}>{v}</span>
  </div>);
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'flex',gap:16,alignItems:'flex-start'}}>
    <GlassPanel title="Operator // You" active style={{flex:1.2}}>
      <div style={{display:'flex',gap:24}}>
        <Stat l="Credits" v="12,480" c="var(--accent-ui)"/><Stat l="Hand" v="6/7"/><Stat l="Bonus" v="3"/>
      </div>
    </GlassPanel>
    <GlassPanel title="VULT-3R" status="THINKING" style={{flex:1}}>
      <div style={{display:'flex',gap:24}}><Stat l="Credits" v="9,120"/><Stat l="Hand" v="4/7"/></div>
    </GlassPanel>
    <GlassPanel title="Feed // Log" style={{flex:1}}>
      <div style={{font:'var(--type-terminal)',color:'var(--text-secondary)'}}>
        <div>&gt; nomad sold 2&times; scrap</div>
        <div style={{color:'var(--accent-ui)'}}>&gt; your turn_</div>
      </div>
    </GlassPanel>
  </div>
);
});
</script></body></html>
