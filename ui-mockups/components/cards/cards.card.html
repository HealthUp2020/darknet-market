<!-- @dsCard group="Components" viewport="700x260" name="Game Cards" subtitle="Rare (glowing) vs common (matte) frames" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>window.__dsReady=new Promise(function(r){var s=document.createElement('script');s.src='../../_ds_bundle.js';s.onload=r;s.onerror=r;document.head.appendChild(s)});</script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head><body style="padding:22px 20px 16px"><div id="root"></div>
<script type="text/babel">
window.__dsReady.then(()=>{
const NS=(()=>{for(const k of Object.getOwnPropertyNames(window)){try{const v=window[k];if(v&&typeof v==='object'&&v.Button&&v.GameCard)return v}catch(e){}}return{}})();
const {GameCard}=NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',gap:12,alignItems:'flex-end'}}>
      <GameCard width={100} accent="cyan" name="Datashard" value={9}/>
      <GameCard width={100} accent="gold" name="Gilded Chrome" value={8}/>
      <GameCard width={100} accent="magenta" name="Black ICE" value={9} selected/>
      <GameCard width={100} accent="purple" name="Synth-Silk" value={4}/>
      <GameCard width={100} accent="green" name="Stim-Packs" value={3}/>
      <GameCard width={100} accent="orange" name="Scrap" value={2} disabled/>
    </div>
    <div style={{font:'400 9px/1.4 var(--font-body)',color:'var(--text-muted)'}}>Rare: full border, inner hairline, 3 pips, permanent glow. Common: 55% border, 1 pip, matte. Selected: cyan ring + lift. Disabled: dimmed, glow stripped.</div>
  </div>
);
});
</script></body></html>
